A Letter For You

<p id="typing"></p>

id="nextBtn"
style="display:none;"
onclick="fadeTo('timeline.html')">

Continue Our Journey →

</button>

</div>

</section>

<script src="script.js"></script>

<script>

const letter=`Happy Girlfriend's Day ❤️

Sometimes I wonder how life would have looked if our paths had never crossed.

Then I stop thinking about it...

Because I don't want to imagine a world where I never met you.

Thank you for every smile that made difficult days easier.

Thank you for every laugh that became one of my favorite memories.

Thank you for being patient,
kind,
caring,
and wonderfully yourself.

You inspire me to become a better person every single day.

I know life won't always be perfect.

We'll have busy days.

We'll have misunderstandings.

We'll have moments that test us.

But if there's one thing I'll always choose...

I'll choose us.

No matter where life takes us,
I hope we continue collecting beautiful memories together.

Happy Girlfriend's Day.

❤️`;

startTyping(letter,"typing",28);

setTimeout(()=>{

document.getElementById("nextBtn").style.display="inline-block";

},letter.length*28+800);

</script>
