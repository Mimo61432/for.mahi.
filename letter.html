const letter=`My Love,

Honestly, mujhe abhi bhi believe nahi hota ki sirf 4 din mein koi itna special ban sakta hai. Log shayad kahenge it's too early, but feelings kabhi calendar dekh kar nahi aati.

Tumse milna completely unexpected tha, aur shayad isi liye itna beautiful bhi. Har baat, har smile, aur tumhare saath bitaya hua har moment mujhe yeh feel karata hai ki kuch connections explain nahi kiye ja sakte sirf feel kiye ja sakte hain.


Chaar din ka safar tha, par ehsaas sadiyon sa ho gaya,
Ek anjaan chehra, meri duaon ka hissa ho gaya.
Na waqt ki shart thi, na kisi plan ka asar,
Bas tum mile... aur dil ko apna humsafar mil gaya.


I don't know what the future holds, but I know one thing I want to cherish every moment with you, without rushing anything. Thank you for making these four days feel so unforgettable.

Happy Girlfriend's Day, my unexpected favorite person. ❤️`;

startTyping(letter,"typing",28);

document.getElementById("nextBtn").style.display="inline-block";

},letter.length*28+800);
